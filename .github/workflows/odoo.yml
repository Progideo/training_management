name: CI Training Management

on:
  pull_request:
    paths:
      - "addons/**"
      - "tests/**"
      - "migration/**"
      - "deployment/**"
      - "docs/ci.md"
      - ".github/workflows/**"
      - ".pre-commit-config.yaml"
      - ".pylintrc"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orchestration:
    name: Qualité du code et orchestration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer les outils de contrôle
        run: python3 -m pip install -r tests/ci/requirements.txt pre-commit
      - name: Vérifier couverture, erreurs et verdict final
        run: python3 -m unittest discover -s tests -v
      - name: Style et règles Odoo
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Vérifier la localisation et les paramètres de lancement natifs
        run: python3 tests/ci/run_launch_settings.py
        env:
          TM_CI_ID: ${{ github.run_id }}_${{ github.run_attempt }}_launch
      - name: Vérifier la politique d’émargement C06
        run: python3 tests/ci/run_attendance_policy.py
        env:
          TM_CI_ID: ${{ github.run_id }}_${{ github.run_attempt }}_attendance
      - name: Vérifier les accès et réservations C06
        run: python3 tests/ci/run_pedagogical_policy.py
        env:
          TM_CI_ID: ${{ github.run_id }}_${{ github.run_attempt }}_pedagogy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c06-pedagogy-results
          path: test-results/c06-pedagogy/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c06-attendance-results
          path: test-results/c06-attendance/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-settings-results
          path: test-results/launch-settings/
          if-no-files-found: error

  suite:
    name: Suite cumulative — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - configuration: core
            label: Socle
          - configuration: sale
            label: Socle + Ventes
          - configuration: survey
            label: Socle + Surveys
          - configuration: full
            label: Socle + Ventes + Surveys
          - configuration: website_sale
            label: Website/eLearning + Ventes · anglais
          - configuration: website_full
            label: Website/eLearning + Ventes + Surveys · anglais
          - configuration: website_sale_fr
            label: Website/eLearning + Ventes · français
          - configuration: website_full_fr
            label: Website/eLearning + Ventes + Surveys · français
    env:
      TM_CI_ID: ${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Exécuter toute la suite pour cette configuration
        run: python3 tests/ci/run_suite.py "$CONFIGURATION"
        env:
          CONFIGURATION: ${{ matrix.configuration }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-${{ matrix.configuration }}-results
          path: test-results/suite-${{ matrix.configuration }}/
          if-no-files-found: error

  migrations:
    name: Migrations, conservation et concurrence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TM_CI_ID: ${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer le lecteur de journaux des migrations
        run: |
          if ! command -v rg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ripgrep
          fi
      - name: Vérifier tous les historiques sans relancer la suite
        run: python3 tests/ci/run_suite.py migrations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migrations-results
          path: test-results/migrations/
          if-no-files-found: error

  validation:
    name: Validation CI Odoo
    needs: [orchestration, suite, migrations]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-results"
          path: test-results
      - name: Refuser tout résultat incomplet ou non réussi
        if: ${{ always() }}
        run: python3 tests/ci/check_results.py
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
