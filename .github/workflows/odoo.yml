name: CI Odoo

on:
  pull_request:
    paths:
      - "addons/**"
      - "tests/probes/**"
      - "tests/ci/**"
      - "tests/test_odoo_ci.py"
      - "docs/ci.md"
      - ".github/workflows/odoo.yml"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orchestration:
    name: Contrôles de l’orchestration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer le lecteur YAML des tests de workflow
        run: python3 -m pip install -r tests/ci/requirements.txt
      - name: Vérifier couverture, erreurs et contrôle final
        run: python3 -m unittest discover -s tests -p 'test_odoo_ci.py' -v
      - name: Installer pre-commit
        run: python3 -m pip install pre-commit
      - name: Style et règles Odoo (ruff, pylint-odoo)
        run: |
          set -o pipefail
          pre-commit run --all-files --show-diff-on-failure 2>&1 | tee pre-commit.log
      - name: Diagnostic temporaire pre-commit (annotations, à retirer)
        if: failure()
        run: |
          msg=$(grep -v "^\s*$" pre-commit.log | head -n 60 | cut -c1-260 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=pre-commit::$msg"

  scenarios:
    name: Odoo — ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        scenario: [incremental, fresh, history, website]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: fictional_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ODOO_IMAGE: odoo@sha256:61e3c71b0503c5f658e604c3e340bede20b97d05f726179fa006eae50a32fd23
      TM_CI_ID: ${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exécuter le scénario et conserver ses mesures
        run: bash tests/ci/run_odoo_scenario.sh "$SCENARIO"
        env:
          SCENARIO: ${{ matrix.scenario }}
      - name: Diagnostic temporaire (annotations, à retirer)
        if: failure()
        run: |
          d=test-results/${{ matrix.scenario }}
          awk -F'\t' 'NR>1 && $2!=0 {print $1}' $d/timings.tsv | while IFS= read -r step; do
            f=$d/$step.log
            [ -f "$f" ] || continue
            msg=$(grep -n -E "^(FAIL|ERROR):|Traceback|AssertionError|AssertionError:|Error:|Exception:" "$f" | grep -v "mail_mail\|failed sending" | head -12 | cut -c1-260 | sed ':a;N;$!ba;s/\n/%0A/g')
            tb=$(grep -n -B2 -A16 -m2 "Traceback" "$f" | cut -c1-220 | tail -n 42 | sed ':a;N;$!ba;s/\n/%0A/g')
            end=$(grep -n -A8 -E "ParseError|Error: |Exception: " "$f" | tail -n 30 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$step::$msg%0A----%0A$tb%0A====%0A$end"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odoo-${{ matrix.scenario }}-results
          path: test-results/${{ matrix.scenario }}/
          if-no-files-found: error

  validation:
    name: Validation CI Odoo
    needs: [orchestration, scenarios]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: odoo-*-results
          path: test-results
      - name: Refuser tout résultat incomplet ou non réussi
        run: python3 tests/ci/check_results.py
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
